[theme]
base = "light"
# Navy, not green: Streamlit uses primaryColor for text on primary buttons,
# active tabs, links, and focus rings, and it forces white text on that fill.
# Green on white is too faint. Green stays an accent in CSS and in greenTextColor.
primaryColor = "#05192D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F5"
textColor = "#080808"
linkColor = "#05192D"
borderColor = "#E6E4DD"
dataframeBorderColor = "#E6E4DD"
dataframeHeaderBackgroundColor = "#F7F7F5"
greenTextColor = "#027A3A"
greenBackgroundColor = "#E3FCEC"
codeBackgroundColor = "#F7F7F5"
codeTextColor = "#05192D"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap, sans-serif"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&display=swap, monospace"
baseFontSize = 16
codeFontSize = "0.82rem"
headingFontSizes = ["2.1rem", "1.45rem", "1.15rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [800, 700, 700, 600, 600, 600]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 700
baseRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = false

[theme.sidebar]
backgroundColor = "#05192D"
secondaryBackgroundColor = "#0E2A45"
textColor = "#FFFFFF"
primaryColor = "#03EF62"
linkColor = "#03EF62"
borderColor = "#2A4661"
codeBackgroundColor = "#0E2A45"

[server]
headless = true

[client]
toolbarMode = "minimal"
